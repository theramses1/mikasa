plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moiehfih.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.moiehfih.app"
        minSdk 26
        targetSdk 34
        // CI pasa -PversionCode=<número de ejecución> para que cada APK actualice al anterior.
        def code = Integer.parseInt(String.valueOf(project.findProperty('versionCode') ?: '1'))
        versionCode code
        versionName "1.0.${code}"
    }

    // Firma: si existen las variables MOIEHFIH_KEYSTORE* (secretos de CI) se usa esa
    // llave, así cada APK nuevo se instala encima del anterior. Si no, se usa la
    // llave de depuración que genera Android Gradle Plugin.
    def keystorePath = System.getenv('MOIEHFIH_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('MOIEHFIH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOIEHFIH_KEY_ALIAS')
                keyPassword System.getenv('MOIEHFIH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    // La app web vive en ../moiehfih y se empaqueta tal cual como assets.
    sourceSets {
        main {
            assets.srcDirs = ['../moiehfih']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
