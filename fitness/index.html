<!doctype html>
<html lang="es">

    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Registro de dieta, macros, peso corporal, entrenamientos y bitácora con objetivos adaptativos." />
    <title>Mikasa Fit</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 id="title">Mikasa Fit</h1>
      <button class="icon-btn" data-action="go" data-tab="ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>

    <main id="view"></main>

      <button data-action="go" data-tab="peso"><span class="ti">⚖</span>Peso</button>
      <button data-action="go" data-tab="bitacora"><span class="ti">✎</span>Bitácora</button>

    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="js/app.js"></script>
