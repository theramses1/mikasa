plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mikasa.charadas'
    compileSdk 34

    defaultConfig {
        applicationId "com.mikasa.charadas"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Llave fija para que las nuevas versiones se instalen encima de las anteriores.
    signingConfigs {
        fixed {
            storeFile file('charadas.keystore')
            storePassword 'charadas123'
            keyAlias 'charadas'
            keyPassword 'charadas123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
