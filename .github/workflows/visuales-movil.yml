name: Visuales Móvil (APK)

on:
  push:
    paths:
      - 'visuales-movil/**'
      - '.github/workflows/visuales-movil.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visuales-movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: visuales-movil-apk
          path: visuales-movil/app/build/outputs/apk/release/*.apk
