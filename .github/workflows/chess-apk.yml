name: APK Puzzles de Mate

on:
  push:
    paths:
      - 'chess/**'
      - '.github/workflows/chess-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Tests
        run: gradle :chess:testDebugUnitTest
      - name: Compilar APK
        run: gradle :chess:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: puzzles-de-mate-apk
          path: chess/build/outputs/apk/debug/chess-debug.apk
