name: MoiehFih APK

on:
  push:
    paths:
      - 'moiehfih/**'
      - 'moiehfih-android/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/moiehfih-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la app web
        working-directory: moiehfih
        run: node --test tests/*.test.mjs

      - name: Preparar llave de firma (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MOIEHFIH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moiehfih.keystore"
            echo "MOIEHFIH_KEYSTORE=$RUNNER_TEMP/moiehfih.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto MOIEHFIH_KEYSTORE_BASE64: el APK se firma con una llave de depuración temporal."
          fi

      - name: Compilar APK
        env:
          MOIEHFIH_KEYSTORE_PASSWORD: ${{ secrets.MOIEHFIH_KEYSTORE_PASSWORD }}
          MOIEHFIH_KEY_ALIAS: ${{ secrets.MOIEHFIH_KEY_ALIAS }}
          MOIEHFIH_KEY_PASSWORD: ${{ secrets.MOIEHFIH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :moiehfih-android:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
          cp moiehfih-android/build/outputs/apk/release/moiehfih-android-release.apk MoiehFih.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoiehFih-apk
          path: MoiehFih.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moiehfih-v1.0.${{ github.run_number }}
          name: MoiehFih 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MoiehFih.apk
          body: |
            APK de MoiehFih (dieta, macros, peso, entrenos y bitácora).
            Descárgalo en tu Android y ábrelo para instalar (permite "instalar apps de origen desconocido").
