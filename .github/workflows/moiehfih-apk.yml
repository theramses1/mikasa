name: MoiehFih APK

on:
  push:
    paths:
      - 'moiehfih/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/moiehfih-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MOIEHFIH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moiehfih.keystore"
            echo "MOIEHFIH_KEYSTORE=$RUNNER_TEMP/moiehfih.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto MOIEHFIH_KEYSTORE_BASE64: el APK se firma con una llave de depuración temporal."
          fi

      - name: Pruebas y compilación
        env:
          MOIEHFIH_KEYSTORE_PASSWORD: ${{ secrets.MOIEHFIH_KEYSTORE_PASSWORD }}
          MOIEHFIH_KEY_ALIAS: ${{ secrets.MOIEHFIH_KEY_ALIAS }}
          MOIEHFIH_KEY_PASSWORD: ${{ secrets.MOIEHFIH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :moiehfih:testDebugUnitTest :moiehfih:assembleDebug :moiehfih:assembleRelease \
            -PversionCode=${{ github.run_number }} --stacktrace
          mkdir -p apks
          cp moiehfih/build/outputs/apk/release/moiehfih-release.apk apks/MoiehFih.apk
          cp moiehfih/build/outputs/apk/debug/moiehfih-debug.apk apks/MoiehFih-debug.apk

      - name: Resultados de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: moiehfih/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: moiehfih-apks
          path: apks/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: moiehfih-apks
          path: apks

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash moiehfih/tools/emulator-smoke.sh apks/MoiehFih-debug.apk screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: screenshots/

  release:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moiehfih-apks
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: moiehfih-v1.0.${{ github.run_number }}
          name: MoiehFih 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: apks/MoiehFih.apk
          body: |
            MoiehFih: dieta, macros, peso corporal, entrenamientos con progresión de cargas y bitácora.
            Descarga MoiehFih.apk en tu Android y ábrelo para instalar (permite "instalar apps de origen desconocido").
